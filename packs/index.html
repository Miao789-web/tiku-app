<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>讲评包</title>
</head>
<body>
<div id="pvRoot"><div class="pv-wrap"><header class="pv-head"><h1>正在加载讲评包…</h1>
<div class="pv-meta">第一次打开需要联网，打开过之后就能断网使用。</div></header></div></div>
<script src="packview.js"></script>
<script>
(function () {
  function q(k) {
    var m = new RegExp('[?&]' + k + '=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function fail(title, msg) {
    document.getElementById('pvRoot').innerHTML =
      '<div class="pv-wrap"><header class="pv-head"><h1>' + title + '</h1>' +
      '<div class="pv-meta">' + msg + '</div></header></div>';
  }
  var id = q('p');
  if (!id) { fail('链接不完整', '请用生成讲评包时给出的完整链接打开。'); return; }

  fetch(id + '/pack.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 404 ? '这堂课讲过之后，讲评包已过期清理了。' : '读取失败（' + r.status + '）');
      return r.json();
    })
    .then(function (pack) {
      PackView.mount(document.getElementById('pvRoot'), pack);
      document.title = pack.title || '讲评包';
    })
    .catch(function (e) { fail('打不开这个讲评包', e.message || '请检查链接是否完整'); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
