<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6fb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>题点 · 拍照整理题库</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body data-tab="on">
  <div class="app">

    <!-- 顶部栏：由 app.js 按页面渲染 -->
    <header class="topbar" id="topbar"></header>

    <!-- 页面容器 -->
    <main class="view" id="view">
      <div class="boot">正在打开题库…</div>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-act="goto" data-to="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-act="goto" data-to="bank">
        <svg viewBox="0 0 24 24"><path d="M4 5.5h7v13H4z"/><path d="M13 5.5h7v13h-7z"/><path d="M6.5 9h2M15.5 9h2"/></svg>
        <span>题库</span>
      </button>
      <button class="tab tab-main" data-act="cap:start">
        <span class="cam"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.2h6.8L17 8.5h3v10H4z"/><circle cx="12" cy="13.2" r="3.3"/></svg></span>
        <span>拍照</span>
      </button>
      <button class="tab" data-act="goto" data-to="review">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V9h-4.5"/></svg>
        <span>复习</span>
      </button>
      <button class="tab" data-act="goto" data-to="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.4"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <!-- 底部弹层 / 全屏预览 -->
    <div id="sheet-root" class="sheet-root"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- 隐藏的文件选择器：拍照 / 相册（支持多选）/ PDF·Word 文档 -->
  <input id="fileCamera" class="hidden-file" type="file" accept="image/*" capture="environment" />
  <input id="fileAlbum" class="hidden-file" type="file" accept="image/*" multiple />
  <input id="fileDoc" class="hidden-file" type="file" accept=".pdf,.docx,.txt,application/pdf" />

  <!-- 依赖顺序：工具 → 配置 → 数据层 → 算法 → 页面 -->
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/normalize.js"></script>
  <script src="js/split.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/image.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/docparse.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/paper.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/vendor/lz-string.min.js"></script>
  <script src="js/packview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
